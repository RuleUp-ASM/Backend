plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ruleup'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

// 소스 인코딩 고정. JDK 18+(JEP 400) 부터 기본 charset 이 UTF-8 이라 지금은 명시하지 않아도
// 통과하지만, 빌드 환경(로케일·러너·IDE)에 따라 달라지는 값을 컴파일 결과가 물려받게 두면
// 소스에 박힌 한글 상수(추천 사유·안내 문구)가 통째로 깨진다. 빌드에서 못 박는다.
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-mysql'
	runtimeOnly 'com.mysql:mysql-connector-j'

	implementation 'org.springframework.boot:spring-boot-starter-security'

	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly  'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly  'io.jsonwebtoken:jjwt-gson:0.13.0'

	implementation 'com.github.f4b6a3:uuid-creator:6.1.1'

	implementation platform('me.paulschwarz:spring-dotenv-bom:5.1.0')
	implementation 'me.paulschwarz:springboot4-dotenv'

	// Swagger UI / OpenAPI 문서 (springdoc v3.x = Spring Boot 4.0 대응 라인)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// OS/하드웨어 지표(OSHI). JVM/Actuator로는 못 얻는 CPU iowait·디스크 IOPS·네트워크 대역폭·Swap·연결 수를
	// 순수 자바(크로스플랫폼)로 수집한다. Spring Boot가 버전 관리하지 않으므로 명시. jna는 transitive.
	implementation 'com.github.oshi:oshi-core:6.6.5'

	implementation 'org.springframework.boot:spring-boot-starter-cache'
	// 탐색 정렬·표시통계·필터 집합(ZSET/HASH/SET). 인스턴스별 Caffeine 으로는 서버가 늘면
	// 순위가 서로 달라져 커서 페이징이 깨진다 — 탐색 테크스펙 5-1이 요구하는 공유 저장소다.
	// Redis 장애·미준비 시 목록·인기는 503을 반환하고 카테고리 개수만 DB로 폴백한다.
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	// 추천 세그먼트 점수·카테고리 마스터 캐시(JVM 로컬). 캐시 매니저는 CacheConfig에서 CaffeineCacheManager로 구성.
	// Spring Boot가 버전 관리하므로 버전 명시 불필요.
	implementation 'com.github.ben-manes.caffeine:caffeine'

	// 커넥션 풀(keep-alive) 지원 HTTP 클라이언트 (OAuth 외부 호출 재사용용)
	// Spring Boot가 버전 관리하므로 버전 명시 불필요.
	implementation 'org.apache.httpcomponents.client5:httpclient5'

	// AWS Bedrock Runtime — 대체 LLM provider(Amazon Nova Lite 등)를 Converse API로 호출.
	// 자격증명은 ECS 태스크 역할(기본 provider 체인). BOM으로 버전 고정.
	implementation platform('software.amazon.awssdk:bom:2.31.0')
	implementation 'software.amazon.awssdk:bedrockruntime'
	// 프로필·챌린지·이의 증빙 이미지 저장(app.upload.storage=s3). Fargate 의 로컬 디스크는
	// 임시 저장소라 배포마다 업로드본이 사라진다 — stg 부터는 S3 가 원본을 들고 있어야 한다.
	implementation 'software.amazon.awssdk:s3'
	// 알림 푸시 대기열(SQS 표준 큐). 적재는 도메인 트랜잭션이 책임지고, 이 큐는 **푸시만**
	// 나른다 — 전송에 실패해도 고지는 이미 성립해 있다(알림 공통 3절).
	implementation 'software.amazon.awssdk:sqs'

	// Firebase Admin SDK — 고스트(무음) 푸시 전송(FCM). 자격증명(서비스 계정)이 있을 때만 활성화되며
	// (app.fcm.enabled), 없으면 LoggingPushSender 스텁으로 폴백해 로컬/CI 기동에 영향 없음.
	//
	// 9.4.1 로는 못 쓴다 — 기본 전송 계층(ApacheHttp2Transport)이 응답을 「이미 압축이 풀린 본문」과
	// 「gzip 이라고 적힌 원본 헤더」로 짝지어 내놓아, 상위 google-http-client 가 평문을
	// GZIPInputStream 으로 열다 터진다. stg 의 모든 푸시가
	// 「Unknown error while making a remote service call: Not in GZIP format」 으로 실패한 원인이다.
	// 9.8.0 이 인코딩을 엔티티에서 읽도록 고쳐 짝이 맞는다 — 그 버그를 고치는 가장 낮은 버전이라
	// 여기에 맞춘다. 더 올리면 google-http-client·gax 계열이 통째로 따라 올라오므로 이유 없이 넓힌다.
	implementation 'com.google.firebase:firebase-admin:9.8.0'

	// 배치 분산 락. 태스크가 둘 이상이면 @Scheduled 가 태스크마다 돌아 정산·알림이 중복된다.
	// 락 저장소는 이미 있는 MySQL(shedlock 테이블) — 새 인프라를 늘리지 않는다.
	implementation 'net.javacrumbs.shedlock:shedlock-spring:7.10.1'
	implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:7.10.1'

	// JDK 25 대응: Lombok 1.18.40+ 필요 (그 이전 버전은 JDK25 bytecode 미지원)
	compileOnly 'org.projectlombok:lombok:1.18.46'
	annotationProcessor 'org.projectlombok:lombok:1.18.46'

	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

	// 테스트 시 @SpringBootTest가 실제 MySQL을 필요로 하므로 Testcontainers로
	// MySQL 8.4 컨테이너를 자동 기동한다(로컬·CI 동일). 모듈 버전은 testcontainers-bom으로 고정.
	testImplementation platform('org.testcontainers:testcontainers-bom:1.20.6')
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'
	// 실제 Redis로 탐색 순서·커서·장애 시 503 계약을 검증한다.
	testImplementation 'com.redis:testcontainers-redis:2.2.2'
	// 이미지 S3 저장을 실제 S3 API(LocalStack)로 검증한다 — 목으로는 키 규칙·presigned 서명·
	// 리다이렉트가 실제로 맞물리는지 알 수 없다.
	testImplementation 'org.testcontainers:localstack'

	testCompileOnly 'org.projectlombok:lombok:1.18.46'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.46'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()

	// 스프링 테스트 컨텍스트가 도메인별로 여러 개 캐시되므로 기본 512m 로는 스위트 후반에
	// OutOfMemoryError 가 난다. 컨텍스트 수를 줄이는 것이 먼저지만(같은 @Import 집합을 쓰면
	// 캐시가 공유된다), 바닥 자체가 낮아 CI 가 간헐적으로 깨지는 것을 막는다.
	maxHeapSize = '2g'

	// 테스트 JVM 의 시간대를 UTC 로 못 박는다. CI 러너와 배포 컨테이너가 UTC 라 거기서는 늘
	// 맞는데, 개발 기기가 다른 시간대면(KST 등) Hibernate 가 쓴 시각과 네이티브 조회가 읽은
	// 시각이 오프셋만큼 어긋난다 — 같은 커밋이 CI 는 통과하고 로컬은 <b>하루 중 특정 시각부터</b>
	// 깨진다. 실제로 이의 신청 기한이 9시간 일찍 닫힌 것으로 읽혀 캘린더 시험이 15:00 KST
	// 이후에만 실패했다. 시간대에 의존하는 로직은 코드가 ZoneId 를 명시해 다루므로(KST 고정),
	// JVM 기본 시간대를 실행 환경마다 다르게 두는 것은 검증에 잡음만 더한다.
	systemProperty 'user.timezone', 'UTC'

	// 로컬(colima) 환경에서 Testcontainers가 Docker 소켓을 자동으로 찾도록 알려준다.
	// colima 소켓은 기본 컨텍스트가 아니라 자동 감지가 안 되기 때문.
	// CI(리눅스)에는 이 파일이 없으므로 블록을 건너뛰고 기본 /var/run/docker.sock 을 쓴다.
	def colimaSock = file("${System.getProperty('user.home')}/.colima/default/docker.sock")
	if (colimaSock.exists()) {
		environment 'DOCKER_HOST', "unix://${colimaSock}"
		environment 'TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE', '/var/run/docker.sock'
	}

	// 우아한 종료는 <b>운영에서만</b> 의미가 있다. 컨텍스트가 닫힐 때마다 스케줄러 종료를
	// 20초씩 기다리는데, 캐시된 컨텍스트가 열댓 개라 그것만으로 빌드 끝에 5분 넘게 버려진다.
	// (로그에 "Timed out while waiting for executor 'taskScheduler' to terminate" 로 남는다)
	// 테스트는 진행 중인 배치 한 사이클을 지켜야 할 이유가 없으므로 기다리지 않는다.
	// 테스트가 끝나면 커버리지 리포트를 자동 생성
	finalizedBy tasks.named('jacocoTestReport')
}

// 커버리지 리포트: CI에서 PR 코멘트로 쓰려면 XML, 사람이 보려면 HTML
tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
	}
}

// 커버리지 게이트 대상: 지금 테스트가 남아 있는 "로그인·온보딩" 도메인만 센다.
// 다른 도메인(챌린지·인증·감시자 등) 테스트를 새로 만들 때 이 목록을 지우고 전체로 되돌린다.
// (전체를 분모로 두면 테스트 없는 도메인 때문에 게이트가 의미 없이 실패한다)
def coverageScope = [
		'com/ruleup/ruleup_backend/auth/**',
		'com/ruleup/ruleup_backend/oauth/**',
		'com/ruleup/ruleup_backend/user/**',
		'com/ruleup/ruleup_backend/agreement/**',
		'com/ruleup/ruleup_backend/moderation/**',
		'com/ruleup/ruleup_backend/score/**',
		'com/ruleup/ruleup_backend/intro/**',
		'com/ruleup/ruleup_backend/onboarding/**',
		'com/ruleup/ruleup_backend/security/**',
]

// 커버리지 게이트: 위 범위의 명령어(instruction) 커버리지가 최소치 미만이면 빌드를 실패시켜 CI를 막는다.
// "지금은 통과, 앞으로의 하락만 차단"이 목적이라 측정값 바로 아래에 바닥을 깐다(현재 ~83.6%).
// 올리려면 minimum 만 상향.
jacocoTestCoverageVerification {
	dependsOn tasks.named('test')
	classDirectories.setFrom(
			files(classDirectories.files.collect { fileTree(dir: it, includes: coverageScope) })
	)
	violationRules {
		rule {
			limit {
				counter = 'INSTRUCTION'
				value = 'COVEREDRATIO'
				minimum = 0.80
			}
		}
	}
}

// build(=check) 시 커버리지 검증까지 강제 → PR·push 모두에서 커버리지 하락을 CI(./gradlew build)가 막는다.
tasks.named('check') {
	dependsOn tasks.named('jacocoTestCoverageVerification')
}

// 실행 가능한 bootJar만 만든다 (plain jar 비활성) → 배포 시 jar 하나만 생김
tasks.named('jar') {
	enabled = false
}