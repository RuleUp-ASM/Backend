# 알람 카탈로그 v2 — 노션 「알람 카탈로그 · SLO 구현 계약」 §9.1 의 저장소 쪽 원장.
# 경보의 실제 정의(임계값·평가·누락 정책)는 alerting/catalog.py 가 원본이고, 이 파일은 ID 별 「어디까지 왔나」를 적는다.
# alerting/tests_catalog.py 가 status 가 active·gated 인 ID 가 catalog.py 에 실제로 있는지 대조한다.
#
# status
#   active   p0_p1.py 를 돌리면 만들어진다
#   gated    원장(env/<env>.json rules.*) 플래그를 켜야 만들어진다 — stg 재현·실수신(G02)·밴드 학습(D+14) 뒤에
#   rule     catalog.py 밖의 스크립트가 만든다 — EventBridge 규칙(security_events.py)·Slack 전달 실패 경보(slack_fallback.py)
#   blocked  외부 도구·계약이 없어 아직 못 만든다(PagerDuty·Healthchecks.io·Sentry·Crashlytics 등)
#   manual   자동 지표가 아니라 사람이 증거를 보고 선언한다
#   followup 이번 범위 밖 — 이유와 대체 감시를 notes 에 적는다
# 「활성」은 경보가 만들어졌다는 뜻일 뿐 실수신·오탐 검증(§9.2 G01~G08)이 끝났다는 뜻이 아니다.

schema_version: 2
status: proposed
resource_registry: infra/monitoring/env/<env>.json
pager: PagerDuty            # alerting/pagerduty.py — 1차 담당 → 10분 미ACK → 팀원(2회 반복). 미계약이라 원장 sns.pagerduty 가 null 인 동안 P0 는 Slack 긴급 채널 멘션만
watchdog: Healthchecks.io   # 미계약 — 원장 healthchecks.* 가 null
slo:
  window_days: 30
  availability: 0.995
  latency_good_fraction: 0.95
  calculation_period_seconds: 60
  ingestion_lag_seconds: 120
  evaluate_windows_and_gates_inside_calculator: true   # lambdas/slo_core.py
  missing_inputs_action: omit_flag
  deployment_budget_gate: {complete_window_days: 30, min_eligible_requests: 1000, min_coverage: 0.99,
                           insufficient_sample_action: review_only}

operations:   # 앱 SliOperation · lambdas/slo_core.OPERATIONS 와 같아야 한다(lambdas/tests/test_contract.py)
  - {id: oauth_google, cuj: C01, route: "POST /api/v1/auth/oauth/google", latency_ms: 3000}
  - {id: oauth_kakao, cuj: C01, route: "POST /api/v1/auth/oauth/kakao", latency_ms: 3000}
  - {id: refresh, cuj: C01, route: "POST /api/v1/auth/refresh", latency_ms: 1000}
  - {id: explore, cuj: C02, route: "GET /api/v1/challenges/explore", latency_ms: 1000}
  - {id: detail, cuj: C02, route: "GET /api/v1/challenges/{challengeId}", latency_ms: 1000}
  - {id: join, cuj: C03, route: "POST /api/v1/challenges/{challengeId}/members", latency_ms: 1500}
  - {id: sync, cuj: C04, route: "POST /api/v1/verifications/sync", latency_ms: 3000}
  - {id: manual, cuj: C04, route: "POST /api/v1/challenges/{challengeId}/verifications", latency_ms: 3000}
  - {id: today, cuj: C05, route: "GET /api/v1/challenges/{challengeId}/verifications/today", latency_ms: 1000}
  - {id: progress, cuj: C05, route: "GET /api/v1/verifications/progress", latency_ms: 1000}

