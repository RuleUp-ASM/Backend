deployment_preflight:   # .github/scripts/monitoring_preflight.py
  block_states: [ALARM]
  block_on_stale_source: true
  require_native_backstops_healthy: true
  insufficient_data_when_fresh: warn_only
  raw_operation_counter: {namespace: RuleUp/SLI, metric: EligibleCount, dimensions: [Env, Service, Operation],
                          statistic: Sum, period_seconds: 60, ingestion_lag_seconds: 120,
                          check_recent_completed_buckets: 3, require_datapoints: 2, missing_raw_series: block}
  budget_freeze: block   # RuleUp/SLO BudgetFreeze=1 (완전한 30일·≥1,000건·coverage ≥99% 에서만 1)
  exception: approved_incident_rollback_only
