# 관리자 Lambda → Redis 통로. Redis 컨테이너는 호스트 포트를 열지 않으므로 이 컨테이너가 6379 를 받아 넘긴다.
# 들어올 수 있는 곳은 보안 그룹이 관리자 Lambda SG 로 묶는다.
global
	maxconn 50
defaults
	mode tcp
	timeout connect 3s
	timeout client 20m
	timeout server 20m
resolvers docker
	nameserver dns 127.0.0.11:53
listen redis
	bind :6379
	server redis redis:6379 resolvers docker init-addr libc,none
