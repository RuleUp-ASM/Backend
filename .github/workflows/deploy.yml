name: Deploy to ECS (stg)

# dev 브랜치 push 시 자동 배포. (테스트는 ci.yml이 병렬로 검증)
on:
  push:
    branches: [ dev ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write   # GitHub OIDC로 AWS 역할 assume (저장된 키 불필요)
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: ruleup-api
  ECS_CLUSTER: ruleup-stg-cluster
  ECS_SERVICE: ruleup-stg-api
  IMAGE_TAG: stg

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # jar는 러너에서 네이티브로 빌드(빠름). 테스트는 ci.yml이 담당하므로 여기선 -x test.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build bootJar
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar -x test

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::961178969292:role/ruleup-stg-gha-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 미리 빌드한 jar만 arm64 런타임 이미지에 복사 → 에뮬레이션 없이 빠름.
      - name: Build & push image (arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.deploy
          platforms: linux/arm64
          provenance: false          # ECS Fargate가 단일 아키 이미지를 받도록(매니페스트 리스트 방지)
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      # 스키마 마이그레이션을 서비스 갱신 전에 별도 태스크(DDL 계정)로 돌린다. 켜기 전에는 공개 API 가 기동 때 돌린다.
      # 전환 절차: infra/admin-split/README.md「마이그레이션 분리」.
      - name: Run schema migration (one-off task)
        if: ${{ vars.MIGRATION_TASK_ENABLED == 'true' }}
        run: bash .github/scripts/run-migration.sh stg ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      # 새 태스크가 뜨지 못하면(마이그레이션 실패·스키마 누락으로 기동 중단) 회로차단기가 이전 태스크로
      # 되돌린다. 그런데 되돌린 뒤에도 services-stable 은 「안정」이라 워크플로가 초록불로 끝난다 —
      # 배포가 실제로 나갔는지는 이번에 만든 deployment 의 rolloutState 로 확인한다.
      - name: Deploy to ECS (rolling)
        run: |
          DEPLOYMENT_ID=$(aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --query 'service.deployments[?status==`PRIMARY`].id | [0]' --output text)
          echo "deployment=$DEPLOYMENT_ID"
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}
          # services-stable 이 풀린 뒤에도 rolloutState 는 옛 태스크 드레이닝이 끝날 때까지 수 초간
          # IN_PROGRESS 로 남는다. 그 순간에 한 번만 보면 성공한 배포를 실패로 오판한다 — 종결 상태까지 기다린다.
          for i in $(seq 1 60); do
            STATE=$(aws ecs describe-services \
              --cluster ${{ env.ECS_CLUSTER }} \
              --services ${{ env.ECS_SERVICE }} \
              --query "services[0].deployments[?id=='$DEPLOYMENT_ID'].rolloutState | [0]" --output text)
            [ "$STATE" != "IN_PROGRESS" ] && break
            sleep 10
          done
          echo "rolloutState=$STATE"
          if [ "$STATE" = "IN_PROGRESS" ]; then
            echo "::error::10분이 지나도 롤아웃이 끝나지 않았다. ECS 서비스 이벤트와 CloudWatch /ecs/ruleup-stg-api 를 확인한다."
            exit 1
          fi
          if [ "$STATE" != "COMPLETED" ]; then
            echo "::error::새 태스크가 뜨지 못해 이전 버전으로 되돌려졌다(rolloutState=$STATE). CloudWatch /ecs/ruleup-stg-api 기동 로그를 확인한다."
            exit 1
          fi

      # 기동 확인 — 헬스체크가 DB 연결까지 본다. 스키마 누락은 기동 단계(SchemaPresenceCheck)에서 이미 걸러진다.
      - name: Smoke test
        run: |
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors https://staging-api.ruleup.co.kr/actuator/health | tee /dev/stderr | grep -q '"status":"UP"'

  # 관리자 API 서비스 — 같은 이미지를 관리자 프로필로. 공개 API 와 따로 배포·롤백된다(실패해도 공개 API 는 그대로).
  # 서비스가 아직 없으면 건너뛴다. 수동 배포·롤백: deploy-admin.yml
  deploy-admin:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::961178969292:role/ruleup-stg-gha-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy admin service
        run: bash .github/scripts/deploy-admin.sh stg 961178969292.dkr.ecr.ap-northeast-2.amazonaws.com/ruleup-api:${{ github.sha }}
