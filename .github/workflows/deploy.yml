name: Deploy to ECS (stg)

# dev 브랜치 push 시 자동 배포. (테스트는 ci.yml이 병렬로 검증)
on:
  push:
    branches: [ dev ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write   # GitHub OIDC로 AWS 역할 assume (저장된 키 불필요)
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: ruleup-api
  ECS_CLUSTER: ruleup-stg-cluster
  ECS_SERVICE: ruleup-stg-api
  IMAGE_TAG: stg

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # jar는 러너에서 네이티브로 빌드(빠름). 테스트는 ci.yml이 담당하므로 여기선 -x test.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build bootJar
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar -x test

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::961178969292:role/ruleup-stg-gha-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 미리 빌드한 jar만 arm64 런타임 이미지에 복사 → 에뮬레이션 없이 빠름.
      - name: Build & push image (arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.deploy
          platforms: linux/arm64
          provenance: false          # ECS Fargate가 단일 아키 이미지를 받도록(매니페스트 리스트 방지)
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to ECS (rolling)
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment >/dev/null
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}