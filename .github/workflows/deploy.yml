name: Deploy to EC2 (dev)

# dev 브랜치에 코드가 들어올 때 (= feature/*를 dev로 머지할 때) 자동 실행
on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 빌드는 여기(GitHub 서버)에서 한다 → t3.micro는 빌드 부담이 없어진다.
      # 테스트는 CI(ci.yml)에서 이미 돌렸으므로 여기선 jar만 만든다.
      - name: Build bootJar
        run: ./gradlew bootJar -x test

      # 만들어진 jar를 EC2로 전송
      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/home/${{ secrets.EC2_USER }}/app"
          strip_components: 2          # build/libs/ 경로 제거하고 app/ 바로 아래에 둠

      # EC2에서 서비스 재시작 (systemd가 그 jar를 실행하도록 미리 설정돼 있어야 함)
      - name: Restart service on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl restart ruleup-backend   # ← 본인 서비스명으로
            sleep 3
            sudo systemctl is-active ruleup-backend  # active면 성공, 아니면 워크플로 실패 처리