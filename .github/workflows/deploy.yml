name: Deploy to EC2 (dev)
on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build bootJar
        run: ./gradlew bootJar -x test

      # jar를 app.jar로 이름 고정해서 준비
      - name: Rename jar
        run: |
          mkdir -p deploy-out
          cp build/libs/*.jar deploy-out/app.jar

      # jar + systemd 유닛 파일을 EC2로 전송
      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy-out/app.jar,deploy/ruleup-backend.service"
          target: "/home/${{ secrets.EC2_USER }}/app"
          strip_components: 1     # deploy-out/ , deploy/ 앞 폴더 제거

      # systemd 유닛 적용 + 서비스 재시작
      - name: Apply unit & restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo cp /home/${{ secrets.EC2_USER }}/app/ruleup-backend.service /etc/systemd/system/ruleup-backend.service
            sudo systemctl daemon-reload
            sudo systemctl restart ruleup-backend
            sleep 5
            sudo systemctl is-active ruleup-backend