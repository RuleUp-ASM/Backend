name: Deploy to EC2 (prod)

# main 브랜치 push 시 운영 배포. dev → main 머지가 곧 릴리스다. (테스트는 ci.yml이 병렬로 검증)
# 운영은 2026-11-27 부터 새 계정(063450199872)의 EC2 한 대다 — 이미지를 ECR 에 올리고, SSM 으로 서버의
# /opt/ruleup/deploy.sh(블루그린: 새 색 기동 → 헬스 통과 → 프록시 전환 → 옛 색 정리)를 부른다.
# AWS 역할이 main 브랜치에서만 assume 되도록 묶여 있어 다른 브랜치에서 돌려도 운영에 닿지 못한다.
on:
  push:
    branches: [ main ]
  workflow_dispatch:   # 같은 커밋을 다시 배포할 때(태스크 재기동·시크릿 교체 반영)

concurrency:
  group: deploy-prod
  # 운영 배포는 중간에 끊지 않는다 — 취소되면 이미지 태그만 바뀌고 서비스는 옛 버전인 채로 남는다.
  cancel-in-progress: false

permissions:
  id-token: write   # GitHub OIDC로 AWS 역할 assume (저장된 키 불필요)
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: ruleup-api
  ASG_NAME: ruleup-prod-api
  IMAGE_TAG: prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # jar는 러너에서 네이티브로 빌드(빠름). 테스트는 ci.yml이 담당하므로 여기선 -x test.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build bootJar
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar -x test

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::063450199872:role/ruleup-prod-gha-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 미리 빌드한 jar만 arm64 런타임 이미지에 복사 → 에뮬레이션 없이 빠름.
      - name: Build & push image (arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.deploy
          platforms: linux/arm64
          provenance: false          # 단일 아키 이미지로 올린다(매니페스트 리스트 방지)
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      # 서버의 deploy.sh 가 실패하면(새 색이 헬스를 통과하지 못함) 프록시는 옛 색 그대로이고 0 이 아닌 값으로 끝난다.
      # 스키마 마이그레이션은 앱이 기동할 때 돌린다. CloudWatch 기반 사전 점검(monitoring_preflight)은 계정 이전으로
      # 뺐다 — 경보가 Grafana 로 옮겨 가면 그쪽 기준으로 다시 붙인다.
      - name: Deploy on server (blue-green via SSM)
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          IID=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG_NAME" \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId | [0]' --output text)
          if [ -z "$IID" ] || [ "$IID" = "None" ]; then echo "::error::서버 인스턴스를 찾지 못했다($ASG_NAME)"; exit 1; fi
          echo "instance=$IID image=$IMAGE"
          CID=$(aws ssm send-command --instance-ids "$IID" --document-name AWS-RunShellScript \
            --comment "deploy ${{ github.sha }}" \
            --parameters "{\"commands\":[\"/opt/ruleup/deploy.sh $IMAGE < /dev/null\"],\"executionTimeout\":[\"900\"]}" \
            --query Command.CommandId --output text)
          for i in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|TimedOut|Cancelled) break;; esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query StandardOutputContent --output text
          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query StandardErrorContent --output text
            echo "::error::배포 실패(status=$STATUS) — 프록시는 이전 버전 그대로다. 위 서버 출력의 기동 로그를 확인한다."
            exit 1
          fi

      - name: Smoke test
        run: |
          # 외부 점검이 보는 무인증 경로 — 사용자와 같은 길(Cloudflare 터널 경유)로 고정 본문이 와야 한다.
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors -H 'Cache-Control: no-cache' https://prod.ruleup.co.kr/health/public | grep -qx 'ruleup-ok'
