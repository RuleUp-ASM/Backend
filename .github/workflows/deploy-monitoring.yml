name: Deploy sync monitoring (stg)

# CloudWatch 감시 계층은 기존 계정(961178969292)에 있었다. 2026-11-27 계정 이전 뒤로는 경보가 Grafana 로 옮겨 가는 중이라
# dev push 로는 돌지 않는다. 수동 실행만 남긴다.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-stg-sync-monitoring
  cancel-in-progress: false

jobs:
  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::961178969292:role/ruleup-stg-gha-deploy
          aws-region: ap-northeast-2
      - name: Verify metric filter against real CloudWatch parser
        run: python3 infra/monitoring/verify-sync-filter.py
      - name: Apply metric filter and SNS alarm
        run: bash infra/monitoring/apply-sync-alarm.sh
