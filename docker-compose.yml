# 경로: Backend-dev/docker-compose.yml
services:
  postgres:
    image: postgres:16
    container_name: ruleup-postgres
    environment:
      POSTGRES_DB: ruleup
      POSTGRES_USER: ruleup
      POSTGRES_PASSWORD: "dltjddms1012"
    ports:
      - "5432:5432"
    volumes:
      - ruleup_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruleup -d ruleup"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  ruleup_pgdata: