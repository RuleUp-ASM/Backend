services:
  mysql:
    image: mysql:8.4
    container_name: ruleup-mysql
    environment:
      MYSQL_DATABASE: ruleup
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpw}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - ruleup_mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpw}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 탐색 파생 인덱스 저장소(캐시가 아님). 없으면 회로차단기가 열려 MySQL 폴백으로 도는데,
  # 그러면 로컬에서 Redis 경로를 아예 못 밟으므로 stg 와 같은 구성으로 띄운다.
  # 인덱스는 기동 시 warm-up 으로 다시 만들어지므로 영속화는 끈다.
  redis:
    # stg ElastiCache 는 엔진 7.1(AWS 자체 버전) — OSS 기준 가장 가까운 라인이 7.2 다.
    image: redis:7.2-alpine
    container_name: ruleup-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  ruleup_mysqldata: