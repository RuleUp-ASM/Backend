# 테스트 전용 오버라이드. 운영 application.yaml의 ${ENV} 자리들을 더미 값으로 채워
# 로컬에서 환경변수 없이도 컨텍스트가 뜨게 한다.
#  · DataSource 접속 정보는 TestcontainersConfiguration(DynamicPropertyRegistrar)이 런타임에 덮어쓰므로
#    아래 username/password는 플레이스홀더 해소용 더미일 뿐 실제로는 쓰이지 않는다.
app:
  # 시험은 공개·관리자 API 를 한 컨텍스트에서 함께 검증한다. 관리자 역할만의 동작은
  # AdminRoleIsolationIT 가 role 을 덮어써서 따로 본다.
  runtime:
    role: all
  # 배치 자동 발화를 끈다. 컨텍스트가 설정별로 열넷 넘게 뜨고 그 하나하나가 스케줄러를 돌리면,
  # 시험과 무관한 배치가 끼어들고 종료 때 이미 닫힌 풀을 건드려 스위트 종료가 늘어진다.
  # 배치의 동작은 각 IT 가 해당 메서드를 <b>직접 불러</b> 검증한다.
  scheduling:
    enabled: false
  # 기동 워밍업을 끈다 — 켜 두면 컨텍스트마다 헬스체크가 20초 동안 503 이다. 동작은 StartupWarmupTest 가 본다.
  warmup:
    enabled: false
  jwt:
    # HS256 키는 32바이트 이상이어야 함 (테스트 전용, 운영 비밀과 무관)
    secret: test-only-secret-please-change-this-must-be-at-least-32-bytes-long-0123456789
  nickname-check:
    # 통합 테스트는 전부 127.0.0.1 로 잡혀 한 윈도우를 공유한다 → 운영 한도(60/분)면
    # 테스트 개수에 따라 429가 터진다. 한도 자체는 NicknameCheckRateLimiterTest 가 검증한다.
    max-per-minute: 100000
  # 심사 계정(심사 계정 테크 스펙). 고정 UUID 라 다른 테스트가 가입으로 만드는 계정과 겹치지 않아
  # 평소 동작에는 영향이 없다. 계정 행은 ReviewAccountFixture 가 시드처럼 직접 심는다.
  #  · 5e01~5e06 심사 계정(코드 있음) · 5e07 코드가 폐기된 심사 계정 · 5e51 더미 멤버 · 5e61 Play 심사 계정(코드 없음)
  #  · 코드는 judge-N 순서로 K7QM-4XRD-9WTF · A2B3-C4D5-E6F7 · Q8W9-E2R3-T4Y5 · M5N6-P7Q8-R9S2 · H3J4-K5M6-N7P8
  #    · W2X3-Y4Z5-A6B7. judge-6 은 자동 인증 IT 전용이다(기기·동의·멤버십을 다른 테스트와 나누지 않는다)
  #  · judge-7(P3Q4-R5S6-T7U8)은 "revoked": true — 코드 유출 대응. 로그인은 안 되고 기존 세션은 스위치와 무관하게 끊긴다
  #  · round 는 시드 생성 모드가 발급하는 {시드 실행일 yyyyMMdd}{순번 2자리}. 이번 회차는 2029120101(만료 2030-01-01 의 31일 전)
  #  · judge-8(B4C5-D6E7-F8G9) → 5e08 은 <b>지난 회차(2029100101) 계정</b>을 실수로 새 코드에 묶은 경우 — subject 의 회차가
  #    round 와 달라 코드가 맞아도 로그인되지 않는다. 나머지 심사 계정의 subject 는 이번 회차다
  #  · 만료는 MutableClock 으로 넘겨서 검증한다 — 그래서 먼 미래로 둔다
  review-accounts: >-
    01930c1e-5a7b-7c2d-9e4f-1a2b3c4d5e01,01930c1e-5a7b-7c2d-9e4f-1a2b3c4d5e02,
    01930c1e-5a7b-7c2d-9e4f-1a2b3c4d5e03,01930c1e-5a7b-7c2d-9e4f-1a2b3c4d5e04,
    01930c1e-5a7b-7c2d-9e4f-1a2b3c4d5e05,01930c1e-5a7b-7c2d-9e4f-1a2b3c4d5e06,
    01930c1e-5a7b-7c2d-9e4f-1a2b3c4d5e07,01930c1e-5a7b-7c2d-9e4f-1a2b3c4d5e08,
    01930c1e-5a7b-7c2d-9e4f-1a2b3c4d5e51,01930c1e-5a7b-7c2d-9e4f-1a2b3c4d5e61
  review-login:
    enabled: true
    round: "2029120101"
    expires-at: "2030-01-01T00:00:00+09:00"
    codes: >-
      [{"label":"judge-1","codeHash":"5902c09a4fe0fd68805ec09248a272c86e513c32b67cba756923a3a9ea955ee4","userId":"01930c1e-5a7b-7c2d-9e4f-1a2b3c4d5e01"},
      {"label":"judge-2","codeHash":"5ff07f62e9e0fb0d3d993603bfcf355030ca2f3e945ff6d3755344fe7693d08d","userId":"01930c1e-5a7b-7c2d-9e4f-1a2b3c4d5e02"},
      {"label":"judge-3","codeHash":"b8179045e76db0648c7a9e311897ea1834d7efa5324e7999e144b26d5d87b5d0","userId":"01930c1e-5a7b-7c2d-9e4f-1a2b3c4d5e03"},
      {"label":"judge-4","codeHash":"2a7e742b89815b345f42a08f40d9105e27d698b885133e6170b73ed2d353efa2","userId":"01930c1e-5a7b-7c2d-9e4f-1a2b3c4d5e04"},
      {"label":"judge-5","codeHash":"6d7b1e0e8c5682f71a9b6bb2e09510c3f16260114e1bd6fbb0a7caa44ac4eb62","userId":"01930c1e-5a7b-7c2d-9e4f-1a2b3c4d5e05"},
      {"label":"judge-6","codeHash":"620e6f68040b60916be10f5bf83d867b21c9bdd8616bfa9dd5fb84066fbd479a","userId":"01930c1e-5a7b-7c2d-9e4f-1a2b3c4d5e06"},
      {"label":"judge-7","codeHash":"8bbff607a751eda14ab8ec60dcd014cb137ca27e6cd9e0cc596d839bf12a164c","userId":"01930c1e-5a7b-7c2d-9e4f-1a2b3c4d5e07","revoked":true},
      {"label":"judge-8","codeHash":"c0969c2a8c968d560f2f9bed94c09363c01b473d11161b9f8843df78becf71c5","userId":"01930c1e-5a7b-7c2d-9e4f-1a2b3c4d5e08"}]
  recommendation:
    # 짧은 테스트 동안 추천 재계산 배치가 끼어들지 않도록 첫 실행을 멀리 민다.
    rebuild-initial-delay-ms: 3600000
  verification:
    # 통합 테스트는 한 유저가 시나리오 안에서 sync 를 연속으로 친다 → 최소 간격을 끈다.
    # 간격 자체의 동작(429 SYNC_TOO_FREQUENT)은 프로퍼티를 덮어쓰는 테스트가 따로 검증한다.
    sync-min-interval-sec: 0
    sync-backlog-min-interval-sec: 0

  explore:
    # Redis 없이 도는 것이 기본이다. 켜진 경로는 ExploreRedisFallbackIT 가 프로퍼티를 덮어써서 검증한다.
    redis:
      enabled: false

  # 인트로 버전 게이트: 플랫폼별 최소 버전을 다르게 둬서 "platform 에 따라 판정이 갈리는지"를 검증한다.
  client:
    android:
      min-version-code: 100
      min-app-version: 1.0.0
    ios:
      min-version-code: 200
      min-app-version: 2.0.0
  oauth:
    kakao:
      client-id: dummy
      client-secret: dummy
      redirect-uri: ruleup://login/callback
    google:
      client-id: dummy
      client-secret: dummy
      redirect-uri: ruleup://login/callback

spring:
  datasource:
    username: test
    password: test
    # 스위트 전체가 MySQL 컨테이너 <b>하나</b>를 공유하는데, 스프링 테스트 컨텍스트는 설정이
    # 다르면 따로 캐시된다 — 지금 `@SpringBootTest(properties = ...)` 를 쓰는 클래스가 열넷이라
    # 그만큼 풀이 동시에 살아 있다. 운영 기본값(20)이면 280 커넥션을 요구하는 셈이고, MySQL 의
    # 기본 상한(151)을 넘긴다 — 스위트 후반의 "Pool is empty"·"Communications link failure" 가
    # 그 모습이다. 작게 잡고 놀면 반납하게 해서 열넷이 함께 떠 있어도 상한 아래에 둔다.
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
      idle-timeout: 10000
  task:
    scheduling:
      # 스케줄러 자체를 끄지만(app.scheduling.enabled=false), 남는 스레드풀이 있더라도
      # 컨텍스트가 닫힐 때 짧게 기다렸다 내린다.
      shutdown:
        await-termination: true
        await-termination-period: 2s
  # 테스트는 인메모리(ConcurrentMap) 캐시를 쓴다.
  # (CacheConfig의 CaffeineCacheManager 빈은 @Profile("!test")로 빠진다.)
  cache:
    type: simple
  # 테스트에는 Redis 컨테이너를 띄우지 않는다 — 대부분의 IT 는 탐색과 무관하고,
  # 컨테이너를 하나 더 띄우면 전체 스위트가 느려진다. 탐색은 회로가 열린 채 MySQL 경로로 돈다.
  # Redis 경로와 두 경로의 순서 동일성은 ExploreRedisFallbackIT 가 실제 Redis 로 따로 검증한다.
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      timeout: 100ms
      connect-timeout: 100ms
