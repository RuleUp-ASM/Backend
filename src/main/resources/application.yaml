spring:
  application:
    name: ruleup-backend

  datasource:
    url: jdbc:mysql://localhost:3306/ruleup?serverTimezone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration   # 1단계에서 여기에 SQL 넣을 예정

  servlet:
    multipart:
      max-file-size: 10MB     # 프로필 사진 10MB 제한 (스펙)
      max-request-size: 11MB

# 우리 앱 전용 설정 (외부에서 받는 값은 전부 .env에서 주입)
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: 1800        # 30분 (초)
    refresh-token-ttl: 1209600    # 14일 (60*60*24*14)
    signup-token-ttl: 300         # 5분
  oauth:
    kakao:
      client-id: ${KAKAO_REST_API_KEY}
      client-secret: ${KAKAO_CLIENT_SECRET}
      redirect-uri: ${KAKAO_REDIRECT_URI}
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      redirect-uri: ${GOOGLE_REDIRECT_URI}
  app:
    llm:
      solar:
        api-key: ${UPSTAGE_API_KEY:}                 # 비밀키만 env (없어도 기동은 됨, 호출 시에만 필요)
        model: solar-pro2
        base-url: https://api.upstage.ai/v1
        timeout-ms: 5000
      gemini:
        api-key: ${GEMINI_API_KEY:}
        model: gemini-2.5-flash-lite
        timeout-ms: 5000

  # 프로필 이미지 로컬 저장 위치 (ImageStorageService 기본값과 동일)
  upload:
    dir: ./uploads

  # 리버스 프록시(EC2 + Cloudflare 터널) 뒤에서 Swagger Try-it-out이 정확한 주소로 가도록.
  # 로컬은 비워두고, EC2에서만 systemd 환경변수로 채운다: SWAGGER_SERVER_URL=https://<도메인>
  swagger:
    server-url: ${SWAGGER_SERVER_URL:}

# Swagger / OpenAPI 문서 설정
springdoc:
  swagger-ui:
    enabled: true                 # 운영에서 닫고 싶으면 false (또는 SPRINGDOC_SWAGGER_UI_ENABLED=false)
    path: /swagger-ui.html        # 접속 주소
    operations-sorter: method
  api-docs:
    enabled: true                 # 문서(JSON)까지 닫으려면 false
    path: /v3/api-docs


logging:
  level:
    # 기본 유저는 우리 설정상 쓸 수 없으니, 'generated password' 경고만 숨김
    org.springframework.boot.security.autoconfigure: error
    org.springframework.boot.autoconfigure.security: error

server:
  forward-headers-strategy: framework