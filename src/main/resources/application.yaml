spring:
  application:
    name: ruleup-backend

  # Jackson 3 기본은 누락/null 원시값(boolean 등) 역직렬화 실패. 계약상 일부 필드(예: penalty.groupShare)는
  # 생략 가능하므로, 누락/null 원시값은 기본값으로 받아들이도록 완화한다(요청 본문 호환).
  jackson:
    deserialization:
      fail-on-null-for-primitives: false

  datasource:
    # 접속 주소는 env(DB_URL)로 주입한다. 미설정 시 로컬 기본값(localhost)으로 폴백.
    #  · 운영(RDS): DB_URL=jdbc:mysql://<rds-endpoint>:3306/ruleup?serverTimezone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true&sslMode=REQUIRED
    #  · 로컬: env 미설정이면 아래 기본값 사용.
    url: ${DB_URL:jdbc:mysql://localhost:3306/ruleup?serverTimezone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # 동시 로그인이 몰릴 때 기본값(10)으로는 DB 커넥션이 말라 지연될 수 있어 명시.
      # 토큰 발급마다 refresh_tokens write가 일어나므로 여유를 둔다.
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

  flyway:
    enabled: true
    locations: classpath:db/migration   # 1단계에서 여기에 SQL 넣을 예정

  # 캐시는 Caffeine(JVM 로컬). 캐시 매니저는 CacheConfig(@Profile("!test"))가 명시적으로 구성하므로
  # spring.cache.type / spring.data.redis 설정 불필요(ElastiCache(Redis) 제거).

  servlet:
    multipart:
      max-file-size: 10MB     # 프로필 사진 10MB 제한 (스펙)
      max-request-size: 11MB

# 우리 앱 전용 설정 (외부에서 받는 값은 전부 .env에서 주입)
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: 1800        # 30분 (초)
    refresh-token-ttl: 604800    # 7일 (60*60*24*7)
    signup-token-ttl: 300         # 5분
  # 추천 세그먼트 점수 윈도우 배치 튜닝(SegmentScoreService, 매일 04:00 KST).
  recommendation:
    segment-window-days: ${RECO_SEGMENT_WINDOW_DAYS:30}        # 최근 N일 생성 챌린지만 인기도 집계
    # 루틴 아웃컴 수집 배치(RoutineOutcomeCollector, 매일 03:30 KST). 첫 수집 시 최근 N일치 소급.
    outcome-lookback-days: ${RECO_OUTCOME_LOOKBACK_DAYS:30}

  # 시스템 자원 지표 샘플러(SystemMetricsSampler, 개발기간 관찰용). test 프로파일에선 비활성.
  observability:
    metrics:
      sample-interval-ms: ${SYS_METRICS_INTERVAL_MS:60000}     # 수집 주기(기본 60초)
      retention-days: ${SYS_METRICS_RETENTION_DAYS:14}         # 스냅샷 보관 일수(초과분 정리)
  oauth:
    kakao:
      client-id: ${KAKAO_REST_API_KEY}
      client-secret: ${KAKAO_CLIENT_SECRET}
      redirect-uri: ${KAKAO_REDIRECT_URI:}
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:}
    # 서버 콜백(/login/{provider}/callback)이 인가코드를 앱으로 넘길 커스텀 스킴 딥링크.
    # iOS는 카카오가 요구하는 https redirect를 앱이 직접 못 잡으므로 서버가 중계한다.
    app-redirect-uri: ${APP_OAUTH_REDIRECT_URI:ruleup://login/callback}
  llm:
    # 활성 LLM provider. gemini(기본) | bedrock. env(LLM_PROVIDER)로 스위치 — 코드/빌드 변경 없이 모델 교체.
    #  · gemini  → GeminiClient 활성(Google Gemini)
    #  · bedrock → BedrockNovaClient 활성(AWS Bedrock Nova, 자격증명=ECS 태스크 역할)
    provider: ${LLM_PROVIDER:gemini}
    gemini:
      api-key: ${GEMINI_API_KEY:}                  # 비밀키만 env (없어도 기동은 됨, 호출 시에만 필요)
      model: ${GEMINI_MODEL:gemini-3.1-flash-lite} # 모델 업그레이드는 코드 변경 없이 env 로(예: 최신 Flash/Flash-Lite)
      base-url: https://generativelanguage.googleapis.com/v1beta
      timeout-ms: ${GEMINI_TIMEOUT_MS:10000}       # connect·read 공통(재시도와 곱해지므로 과도하게 올리지 말 것)
      max-retries: ${GEMINI_MAX_RETRIES:2}         # 503(UNAVAILABLE)·429·타임아웃 시 재시도 횟수
      retry-backoff-ms: ${GEMINI_RETRY_BACKOFF_MS:300}  # 지수 백오프 base (300→600→1200ms)
    bedrock:
      region: ${BEDROCK_REGION:us-east-1}          # Bedrock·모델 승인이 된 리전
      model-id: ${BEDROCK_MODEL_ID:us.amazon.nova-lite-v1:0}  # Nova Lite 온디맨드 크로스리전 추론 프로파일
      timeout-ms: ${BEDROCK_TIMEOUT_MS:8000}       # Converse 총 호출 타임아웃
      max-retries: ${BEDROCK_MAX_RETRIES:2}        # 쓰로틀 재시도 횟수
      retry-backoff-ms: ${BEDROCK_RETRY_BACKOFF_MS:300}

  # 장소 검색 프록시(§5.2 NEARBY_BRAND 앵커 바인딩). 키 없으면 빈 결과(graceful).
  places:
    naver:
      base-url: https://openapi.naver.com
      client-id: ${NAVER_CLIENT_ID:}               # 발급 후 주입(없으면 검색 빈 결과)
      client-secret: ${NAVER_CLIENT_SECRET:}
      timeout-ms: 3000

  # 프로필 이미지 로컬 저장 위치 (ImageStorageService 기본값과 동일)
  upload:
    dir: ./uploads

  # 감시자(§11.4). 연락처 암호화 키는 prod 필수(Secrets Manager), 로컬은 미설정 시 임시 키로 동작.
  watcher:
    contact-secret: ${WATCHER_CONTACT_SECRET:}
    invite-base-url: ${WATCHER_INVITE_BASE_URL:https://ruleup.app}

  # 앱 버전 게이트 (GET /intro). 배포 환경마다 env로 바꿔 끼운다.
  client:
    min-version-code: ${MIN_APP_VERSION_CODE:1}   # 이 코드 미만이면 강제 업데이트(400)
    min-app-version: ${MIN_APP_VERSION:1.0.0}      # 화면 표시용 최소 버전명
    recommend-app-version: ${RECOMMEND_APP_VERSION:1.0.0}  # 화면 표시용 권장 버전명
    dev-test-msg: ${DEV_TEST_MSG:}                 # 점검/안내 메시지 (없으면 빈값 → null)

  # 리버스 프록시(EC2 + Cloudflare 터널) 뒤에서 Swagger Try-it-out이 정확한 주소로 가도록.
  # 로컬은 비워두고, EC2에서만 systemd 환경변수로 채운다: SWAGGER_SERVER_URL=https://<도메인>
  swagger:
    server-url: ${SWAGGER_SERVER_URL:}

# Swagger / OpenAPI 문서 설정
springdoc:
  swagger-ui:
    enabled: true                 # 운영에서 닫고 싶으면 false (또는 SPRINGDOC_SWAGGER_UI_ENABLED=false)
    path: /swagger-ui.html        # 접속 주소
    operations-sorter: method
  api-docs:
    enabled: true                 # 문서(JSON)까지 닫으려면 false
    path: /v3/api-docs


logging:
  level:
    # 기본 유저는 우리 설정상 쓸 수 없으니, 'generated password' 경고만 숨김
    org.springframework.boot.security.autoconfigure: error
    org.springframework.boot.autoconfigure.security: error

server:
  forward-headers-strategy: framework